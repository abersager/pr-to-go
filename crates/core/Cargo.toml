[package]
name = "pr-to-go-core"
description = "Storage, GitHub sync, outbox and comment remapping for PR to Go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["keychain"]
# OS keychain support. Tests use an in-memory secret store instead.
keychain = ["dep:keyring"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
sha1.workspace = true
sha2.workspace = true
hex.workspace = true
similar.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "gzip", "charset", "macos-system-configuration"] }
url = "2"
humantime = "2"
lol_html = "2"
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile.workspace = true
fake-github.workspace = true
tokio = { workspace = true, features = ["test-util"] }
