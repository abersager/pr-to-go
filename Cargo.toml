[workspace]
resolver = "3"
members = ["crates/core", "crates/fake-github", "app/src-tauri"]
# The Tauri app embeds the built UI at compile time, so it's built separately
# (see README). Plain `cargo test` covers the core and the fake GitHub.
default-members = ["crates/core", "crates/fake-github"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/abersager/pr-to-go"

[workspace.dependencies]
pr-to-go-core = { path = "crates/core" }
fake-github = { path = "crates/fake-github" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
similar = "2"
tempfile = "3"
